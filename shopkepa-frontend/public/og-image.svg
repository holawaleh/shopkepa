<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D2040;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C9A84C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8C96A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid lines subtle -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1E3A5F" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1E3A5F" stroke-width="1" opacity="0.4"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#1E3A5F" stroke-width="1" opacity="0.4"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#1E3A5F" stroke-width="1" opacity="0.4"/>

  <!-- Gold accent bar top -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)" />

  <!-- Logo badge -->
  <rect x="80" y="80" width="80" height="80" rx="16" fill="#1E3A5F" />
  <text x="120" y="137" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="38" fill="#C9A84C">SK</text>

  <!-- Brand name -->
  <text x="180" y="118" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="42" fill="#E8E8E8" letter-spacing="-1">ShopKepa</text>
  <text x="180" y="150" font-family="Arial,sans-serif" font-size="18" fill="#8AAAD4">by Tech Affairs and Innovative Hub</text>

  <!-- Divider -->
  <line x1="80" y1="190" x2="620" y2="190" stroke="#1E3A5F" stroke-width="2"/>

  <!-- Main headline -->
  <text x="80" y="265" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="54" fill="#FFFFFF" letter-spacing="-1">Nigeria's Most Complete</text>
  <text x="80" y="330" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="54" fill="url(#accent)" letter-spacing="-1">Retail POS Platform</text>

  <!-- Sub text -->
  <text x="80" y="390" font-family="Arial,sans-serif" font-size="22" fill="#8AAAD4">Track credit sales · Multi-branch stock · Job cards · Offline sales</text>

  <!-- Feature pills -->
  <rect x="80" y="430" width="195" height="38" rx="19" fill="#1E3A5F" />
  <text x="178" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#C9A84C" font-weight="600">Installment Tracking</text>

  <rect x="290" y="430" width="165" height="38" rx="19" fill="#1E3A5F" />
  <text x="373" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#C9A84C" font-weight="600">Multi-Branch POS</text>

  <rect x="470" y="430" width="130" height="38" rx="19" fill="#1E3A5F" />
  <text x="535" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#C9A84C" font-weight="600">Job Cards</text>

  <rect x="615" y="430" width="125" height="38" rx="19" fill="#1E3A5F" />
  <text x="678" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#C9A84C" font-weight="600">Offline-ready</text>

  <!-- Pricing badge -->
  <rect x="80" y="510" width="260" height="50" rx="10" fill="#C9A84C" />
  <text x="210" y="542" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="20" fill="#0A1628">From ₦5,000 / month</text>

  <!-- Right side - stat cards -->
  <rect x="780" y="80" width="160" height="130" rx="12" fill="#1E3A5F" />
  <text x="860" y="145" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="48" fill="#C9A84C">15+</text>
  <text x="860" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#8AAAD4">Unique Features</text>

  <rect x="970" y="80" width="160" height="130" rx="12" fill="#1E3A5F" />
  <text x="1050" y="145" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="48" fill="#C9A84C">8</text>
  <text x="1050" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#8AAAD4">Retail Verticals</text>

  <rect x="780" y="240" width="160" height="130" rx="12" fill="#1E3A5F" />
  <text x="860" y="295" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="34" fill="#C9A84C">103</text>
  <text x="860" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#8AAAD4">API Endpoints</text>
  <text x="860" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#8AAAD4">Backend Complete</text>

  <rect x="970" y="240" width="160" height="130" rx="12" fill="#1E3A5F" />
  <text x="1050" y="295" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="34" fill="#C9A84C">100%</text>
  <text x="1050" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#8AAAD4">Offline</text>
  <text x="1050" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#8AAAD4">Capable</text>

  <!-- Modules list -->
  <rect x="780" y="400" width="350" height="170" rx="12" fill="#1E3A5F" />
  <text x="955" y="430" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="700" font-size="14" fill="#C9A84C">SUPPORTED BUSINESS TYPES</text>
  <text x="955" y="458" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#8AAAD4">Supermarkets · Pharmacies · Electronics</text>
  <text x="955" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#8AAAD4">Repair Shops · Fashion · Restaurants</text>
  <text x="955" y="506" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#8AAAD4">Hotels · Grocery · Salons</text>

  <!-- URL at bottom -->
  <text x="80" y="595" font-family="Arial,sans-serif" font-size="18" fill="#8AAAD4">shopkepa.vercel.app</text>
  <line x1="80" y1="580" x2="1120" y2="580" stroke="#1E3A5F" stroke-width="1"/>
</svg>
