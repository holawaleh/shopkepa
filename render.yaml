services:
  - type: web
    name: shopkepa-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn shopkepa.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: shopkepa.settings.production
      - key: PYTHON_VERSION
        value: "3.13.0"